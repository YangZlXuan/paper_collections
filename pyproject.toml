[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-downloader"
version = "1.7.0"
description = "Chinese desktop application for Springer, Elsevier and Wiley batch paper downloads"
requires-python = ">=3.10"
dependencies = ["requests==2.32.5", "openpyxl==3.1.5", "beautifulsoup4==4.14.2", "bibtexparser==1.4.3"]

[project.gui-scripts]
paper-downloader = "paper_downloader.gui:main"

[tool.setuptools.packages.find]
include = ["paper_downloader*"]

[tool.setuptools.package-data]
paper_downloader = ["data/*.json"]
